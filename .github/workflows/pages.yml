name: Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install wasm-tools
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: MineCity2000.Wasm/package-lock.json
      - run: npm ci
        working-directory: MineCity2000.Wasm
      - run: npm run check
        working-directory: MineCity2000.Wasm
      - run: npm test
        working-directory: MineCity2000.Wasm
      - run: dotnet publish MineCity2000.Wasm -c Release
      - run: node MineCity2000.Wasm/tests/e2e/chrome-e2e.mjs
      - run: touch MineCity2000.Wasm/bin/Release/net10.0/publish/wwwroot/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: MineCity2000.Wasm/bin/Release/net10.0/publish/wwwroot

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
